<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Oferta Exclusiva — Canal Oficial de Recarga</title>
  <meta name="description" content="Escolha 3 itens exclusivos para sua conta com desconto especial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
<script src="/pixel.js"></script>
</head>
<body>
  <main class="page">
    <!-- Topo -->
    <header class="topbar">
      <img src="images/logo.png" alt="Logo" class="logo" fetchpriority="high">
      <span class="brand-text">Canal Oficial de<br>Recarga</span>
    </header>

    <!-- Confirmação -->
    <p class="confirm">
      <span class="check">✓</span> Pagamento Confirmado! Seus diamantes chegarão em até 5 minutos.
    </p>

    <!-- Banner -->
    <div class="banner">
      <img src="images/banner.jpg" alt="Escolha 3 itens e aproveite o desconto" loading="lazy" decoding="async">
    </div>

    <!-- Oferta -->
    <section class="offer">
      <h1 class="offer-title">Oferta Exclusiva!</h1>
      <p class="offer-sub">Escolha 3 itens para sua conta</p>

      <ul class="items" id="items">
        <li class="item" data-id="1">
          <button type="button" class="item-btn" aria-pressed="false">
            <span class="item-thumb">
              <img src="images/item-mask.jpg" alt="Máscara Antiga" loading="lazy" decoding="async">
              <span class="item-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
            </span>
            <span class="item-name">Máscara Antiga</span>
            <span class="item-cat">(Barba)</span>
          </button>
        </li>

        <li class="item" data-id="2">
          <button type="button" class="item-btn" aria-pressed="false">
            <span class="item-thumb">
              <img src="images/item-skin.jpg" alt="Skin Sakura" loading="lazy" decoding="async">
              <span class="item-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
            </span>
            <span class="item-name">Skin Sakura</span>
            <span class="item-cat">(1º Passe)</span>
          </button>
        </li>

        <li class="item" data-id="3">
          <button type="button" class="item-btn" aria-pressed="false">
            <span class="item-thumb">
              <img src="images/item-dino.jpg" alt="Dino Verde" loading="lazy" decoding="async">
              <span class="item-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
            </span>
            <span class="item-name">Dino Verde</span>
            <span class="item-cat">(Pet)</span>
          </button>
        </li>
      </ul>

      <p class="counter">Itens selecionados: <strong id="countNow">0</strong>/3</p>

      <div class="price-card">
        <p class="price-old"><span>De</span> <s>R$ 89,90</s></p>
        <p class="price-now">R$ 29,90</p>
        <p class="price-save">Economize R$ 60,00</p>
      </div>

      <button id="cta" class="cta cta-disabled" type="button" disabled="">
        <span class="cta-label">Selecione os 3 itens</span>
      </button>
    </section>
  </main>

  <script src="js/utm-capture.js"></script>
  <script src="js/script.js"></script>
  
  <script src="js/latest.js" data-utmify-prevent-xcod-sck="" data-utmify-prevent-subids="" async="" defer=""></script>

<script>
  window.pixelId = "6a46d17b31c4349c3fb4f40c";
  var a = document.createElement("script");
  a.setAttribute("async", "");
  a.setAttribute("defer", "");
  a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
  document.head.appendChild(a);
</script>
  


</body></html>
