        /* ============================================================
           QUIZ — Autoriza o Árbitro (redesign UI/UX Pro Max)

        :root {
            --c-primary: #00B89C;
            --c-accent: #FF6B00;
            --c-gold: #FFD700;
        }

        /* Fundo ambiente */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient-bg::before,
        .ambient-bg::after {
            content: '';
            position: absolute;
            width: 50vmax;
            height: 50vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            will-change: transform;
        }

        .ambient-bg::before {
            background: radial-gradient(circle, var(--c-primary), transparent 60%);
            top: -14vmax;
            left: -10vmax;
            animation: orbA 20s ease-in-out infinite;
        }

        .ambient-bg::after {
            background: radial-gradient(circle, var(--c-accent), transparent 60%);
            bottom: -16vmax;
            right: -12vmax;
            animation: orbB 24s ease-in-out infinite;
        }

        @keyframes orbA {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(5vmax, 4vmax)
            }
        }

        @keyframes orbB {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-5vmax, -3vmax)
            }
        }

        .page-content {
            position: relative;
            z-index: 1;
        }

        .neon-title {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 12px rgba(0, 184, 156, 0.4));
        }

        /* Barra de progresso */
        .progress-track {
            height: 10px;
            width: 100%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 184, 156, 0.2);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--c-primary), var(--c-accent), var(--c-gold));
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 14px rgba(0, 184, 156, 0.5);
        }

        .score-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.35);
            white-space: nowrap;
        }

        .ff-quiz-card {
            background: linear-gradient(145deg, rgba(3, 22, 18, 0.9) 0%, rgba(2, 13, 11, 0.95) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 184, 156, 0.35);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(0, 184, 156, 0.05);
        }

        .ff-quiz-option {
            background: rgba(3, 22, 18, 0.8);
            border: 2px solid rgba(0, 184, 156, 0.28);
            border-radius: 14px;
            transition: all 0.25s ease;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .ff-quiz-option:hover {
            border-color: rgba(255, 107, 0, 0.8);
            background: rgba(0, 60, 48, 0.8);
            transform: translateX(8px);
            box-shadow: 0 4px 22px rgba(0, 184, 156, 0.3);
        }

        .ff-quiz-option:focus-visible {
            outline: 3px solid var(--c-gold);
            outline-offset: 2px;
        }

        .ff-quiz-option.correct {
            background: #15803d !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.5) !important;
        }

        .ff-quiz-option.incorrect {
            background: #991b1b !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.5) !important;
        }

        .ff-quiz-option.selected {
            background: rgba(0, 184, 156, 0.2);
            border-color: rgba(255, 107, 0, 0.8);
            transform: translateX(8px);
        }

        .ff-quiz-option .opt-letter {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #021;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
            transition: transform 0.2s ease;
        }

        .ff-quiz-option:hover .opt-letter {
            transform: scale(1.08);
        }

        .ff-question-number {
            background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
            color: #021;
        }

        .ff-result-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 999px;
            text-transform: uppercase;
            transition: transform .25s ease, box-shadow .25s ease, background .35s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
        }

        .ff-result-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: skewX(-20deg);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                left: -120%
            }

            55%,
            100% {
                left: 160%
            }
        }

        .ff-result-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 184, 156, 0.6);
            background: linear-gradient(135deg, #00B89C 0%, #007A68 100%);
        }

        .ff-result-btn:focus-visible {
            outline: 3px solid var(--c-gold);
            outline-offset: 3px;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .pop-in {
            animation: popIn 0.4s ease-out;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .ff-quiz-option:hover,
            .ff-result-btn:hover {
                transform: none;
            }
        }
    </style>

    <script>
        // Áudios de feedback
        const acertoAudio = new Audio('assets/acerto.mp3');
        const erroAudio = new Audio('assets/erro.mp3');

        // Dados do quiz (do PHP)
        const questions = [{ "question": "Qual pa\u00eds venceu mais Copas do Mundo na hist\u00f3ria?", "options": ["Alemanha", "It\u00e1lia", "Brasil", "Argentina"], "correct": 2 }, { "question": "Em qual pa\u00eds foi realizada a Copa do Mundo de 2022?", "options": ["Catar", "R\u00fassia", "Brasil", "Fran\u00e7a"], "correct": 0 }, { "question": "Qual sele\u00e7\u00e3o foi campe\u00e3 da Copa do Mundo de 2022?", "options": ["Fran\u00e7a", "Brasil", "Cro\u00e1cia", "Argentina"], "correct": 3 }, { "question": "Quem \u00e9 o maior artilheiro da hist\u00f3ria das Copas do Mundo?", "options": ["Ronaldo", "Pel\u00e9", "Miroslav Klose", "Gerd M\u00fcller"], "correct": 2 }, { "question": "Quantas vezes o Brasil foi campe\u00e3o mundial?", "options": ["4 vezes", "6 vezes", "3 vezes", "5 vezes"], "correct": 3 }, { "question": "Qual foi o artilheiro da Copa do Mundo de 2022?", "options": ["Lionel Messi", "Richarlison", "Neymar", "Kylian Mbapp\u00e9"], "correct": 3 }, { "question": "Em que ano o Brasil ganhou sua primeira Copa do Mundo?", "options": ["1950", "1962", "1970", "1958"], "correct": 3 }, { "question": "Qual jogador \u00e9 o \u00fanico a vencer 3 Copas do Mundo?", "options": ["Ronaldo", "Zidane", "Messi", "Pel\u00e9"], "correct": 3 }];
        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        // Elementos
        const quizContainer = document.getElementById('quizContainer');
        const resultContainer = document.getElementById('resultContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const scoreChip = document.getElementById('scoreChip');
        const progressWrap = document.getElementById('progressWrap');

        // Atualiza barra de progresso e placar
        function updateProgress() {
            const pct = (currentQuestion / questions.length) * 100;
            progressFill.style.width = pct + '%';
            progressText.textContent = `PERGUNTA ${Math.min(currentQuestion + 1, questions.length)} DE ${questions.length}`;
            scoreChip.textContent = score;
        }

        // Carregar pergunta
        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                showResults();
                return;
            }

            answered = false;
            const q = questions[currentQuestion];
            updateProgress();

            let optionsHTML = '';
            q.options.forEach((option, index) => {
                optionsHTML += `
                    <div class="ff-quiz-option p-4 mb-3 flex items-center gap-4" tabindex="0" role="button"
                         data-index="${index}" onclick="selectAnswer(${index})"
                         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectAnswer(${index});}">
                        <div class="opt-letter">${String.fromCharCode(65 + index)}</div>
                        <span class="text-white text-lg" style="text-shadow: 0 1px 4px rgba(0,0,0,0.2);">${option}</span>
                    </div>
                `;
            });

            quizContainer.innerHTML = `
                <div class="pop-in">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="ff-question-number w-12 h-12 rounded-full flex items-center justify-center font-orbitron font-black text-xl">
                            ${currentQuestion + 1}
                        </div>
                    </div>

                    <h2 class="text-2xl font-bold text-white mb-8" style="text-shadow: 0 2px 10px rgba(0,0,0,0.3);">${q.question}</h2>

                    <div id="options">
                        ${optionsHTML}
                    </div>
                </div>
            `;
        }

        // Selecionar resposta
        function selectAnswer(index) {
            if (answered) return;
            answered = true;

            // Marcar opção selecionada
            const options = document.querySelectorAll('.ff-quiz-option');
            options[index].classList.add('selected');

            // Validar resposta localmente
            const q = questions[currentQuestion];
            const isCorrect = (index === q.correct);

            if (isCorrect) {
                score++;
            }

            options.forEach((option, i) => {
                option.style.pointerEvents = 'none';

                if (i === index && !isCorrect) {
                    option.classList.add('incorrect');
                }
                if (i === q.correct) {
                    option.classList.add('correct');
                }
            });

            // Atualizar pontuação
            scoreChip.textContent = score;

            // Efeito sonoro e visual
            if (isCorrect) {
                acertoAudio.currentTime = 0;
                acertoAudio.play().catch(() => { });
                showFeedback('✓ Correto!', 'text-green-400');
            } else {
                erroAudio.currentTime = 0;
                erroAudio.play().catch(() => { });
                showFeedback('✗ Incorreto!', 'text-red-400');
            }

            // Avançar automaticamente após 1.5 segundos
            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1500);
        }

        // Mostrar feedback
        function showFeedback(message, colorClass) {
            const feedback = document.createElement('div');
            feedback.className = `text-center text-2xl font-orbitron font-bold ${colorClass} mt-4 pop-in`;
            feedback.textContent = message;
            document.getElementById('options').appendChild(feedback);
        }

        // Mostrar resultados
        function showResults() {
            progressFill.style.width = '100%';
            progressWrap.classList.add('hidden');
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            resultContainer.classList.add('pop-in');

            document.getElementById('finalScore').textContent = score;

            let message = '';
            const percentage = (score / questions.length) * 100;

            if (percentage === 100) {
                message = 'Incrível! O árbitro te autoriza! Você é um craque da Copa do Mundo! 🏆⚽';
            } else if (percentage >= 80) {
                message = 'Excelente! Você está pronto para a Copa do Mundo 2026! ⚽';
            } else if (percentage >= 60) {
                message = 'Muito bem! Continue estudando o futebol mundial!';
            } else if (percentage >= 40) {
                message = 'Bom esforço! Estude mais sobre a história das Copas do Mundo!';
            } else {
                message = 'Você precisa conhecer melhor a história da Copa do Mundo!';
            }

            document.getElementById('resultMessage').textContent = message;

            // Salvar pontuação na sessão para a roleta
            sessionStorage.setItem('quizScore', score);
            sessionStorage.setItem('quizCompleted', 'true');
        }

        // Resetar quiz
        function resetQuiz() {
            currentQuestion = 0;
            score = 0;

            progressWrap.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');

            loadQuestion();
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
        });
    </script>

    <!-- Animações estilo Framer Motion (Motion One — mesma API, JS puro/sem React) -->
    <script type="module">
        import { animate, stagger } from 'https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm';

        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduce) {
            const container = document.getElementById('quizContainer');

            // Anima a entrada de cada nova pergunta + alternativas em cascata
            function animateQuestion() {
                const heading = container.querySelector('h2');
                if (heading) {
                    animate(heading, { opacity: [0, 1], transform: ['translateY(14px)', 'translateY(0)'] },
                        { duration: 0.4, easing: [0.22, 1, 0.36, 1] });
                }
                const opts = container.querySelectorAll('.ff-quiz-option');
                if (opts.length) {
                    animate(opts, { opacity: [0, 1], transform: ['translateX(-18px)', 'translateX(0)'] },
                        { duration: 0.45, delay: stagger(0.08), easing: [0.22, 1, 0.36, 1] });
                }
            }

            // Observa o container e dispara a animação sempre que a pergunta troca
            const observer = new MutationObserver(() => animateQuestion());
            observer.observe(container, { childList: true });

            // Pop spring na revelação do resultado final
            const result = document.getElementById('resultContainer');
            const resultObserver = new MutationObserver(() => {
                if (!result.classList.contains('hidden')) {
                    animate(result, { opacity: [0, 1], transform: ['scale(0.94)', 'scale(1)'] },
                        { type: 'spring', stiffness: 280, damping: 22 });
                    const trophy = result.querySelector('.fa-trophy');
                    if (trophy) animate(trophy, { transform: ['scale(0) rotate(-30deg)', 'scale(1) rotate(0deg)'] },
                        { type: 'spring', stiffness: 260, damping: 12, delay: 0.15 });
                    resultObserver.disconnect();
                }
            });
            resultObserver.observe(result, { attributes: true, attributeFilter: ['class'] });
        }
    </script>
